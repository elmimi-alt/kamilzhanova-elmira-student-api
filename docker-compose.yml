version: "2.4"

services:
  db:
    image: postgres:16-alpine
    container_name: kamilzhanova-elmira-db
    environment:
      POSTGRES_DB: students
      POSTGRES_USER: elmira
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - student_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elmira -d students"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build: .
    image: kamilzhanova-elmira-student-api:v1.1-kamilzhanova-elmira
    container_name: kamilzhanova-elmira-app
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/students
      SPRING_DATASOURCE_USERNAME: elmira
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      db:
        condition: service_healthy
    networks:
      - student_network

volumes:
  postgres_data:

networks:
  student_network:
    driver: bridge
